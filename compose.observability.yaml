# Optional observability overlay — powers the console's "System" page (service status, resources,
# live logs). Layer it ON TOP of the release (+ public) compose:
#
#   docker compose -f compose.release.yaml -f compose.public.yaml -f compose.observability.yaml \
#     --env-file .env up -d
#
# Security: the `ops` sidecar never touches the raw docker socket. Only `socket-proxy` mounts it,
# read-only, and exposes a GET-only slice of the Docker API on the internal network. So a bug in
# the log viewer can *see* containers but never stop/exec/kill them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: always
    logging: *default-logging
    environment:
      CONTAINERS: 1        # /containers, /containers/<id>/stats, /containers/<id>/logs
      IMAGES: 1
      INFO: 1              # /info  (total memory, cpu count)
      VERSION: 1
      PING: 1
      SYSTEM: 1            # /system/df  (docker disk usage)
      POST: 0              # deny everything that mutates (also the default)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"             # internal only — reached by `ops`, never published to the host

  ops:
    image: ${OTA_CE_NS:-samnite}/ota-ce-ops:${OTA_CE_TAG:-latest}
    build: ./ops
    restart: always
    logging: *default-logging
    depends_on:
      - socket-proxy
    environment:
      DOCKER_HOST_HTTP: http://socket-proxy:2375
      COMPOSE_PROJECT: ota-community-edition
    volumes:
      # read-only host sysfs, for host network throughput (host netns). /sys has no process
      # environ, so nothing sensitive leaks — unlike mounting /proc.
      - /sys:/host/sys:ro
    expose:
      - "9910"             # internal only — reached by the console proxy at /api/ops/
