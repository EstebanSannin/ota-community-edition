<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTA Community Edition — API</title>
  <link rel="stylesheet" href="swagger-ui.css">
  <style>
    body{margin:0;background:#fafbfc}
    .topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0c9e90;color:#fff}
    .topbar .t{font-weight:700;font-size:15px}
    .topbar a{margin-left:auto;color:#fff;text-decoration:none;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 12px}
    .topbar a:hover{background:rgba(255,255,255,.15)}
    .swagger-ui .topbar{display:none}       /* hide Swagger's own URL bar */
    .swagger-ui .info{margin:24px 0}
    #swagger{max-width:1180px;margin:0 auto}
  </style>
</head>
<body>
  <div class="topbar"><span class="t">OTA Community Edition · API reference</span><a href="/">← Back to console</a></div>
  <div id="swagger"></div>
  <script src="swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: 'openapi.yaml',
      dom_id: '#swagger',
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout',
      deepLinking: true,
      docExpansion: 'list',
      defaultModelsExpandDepth: 0,
      supportedSubmitMethods: []   // docs only — no live "Try it out"
    });
  </script>
</body>
</html>
