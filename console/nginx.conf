# Minimal OTA console: serves the static SPA and proxies the backend JSON APIs on the
# same origin (so the browser needs no CORS and no *.ota.ce host resolution).

# WebSocket upgrade plumbing for the web terminal (/api/ras/terminal/<uuid>): "" for normal
# requests so keep-alive still works, "upgrade" when the client asks to upgrade.
map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / { try_files /index.html =404; }

    location /api/director/ {
        proxy_pass http://ota-lith:7300/api/v1/;
        proxy_set_header x-ats-namespace default;
        proxy_set_header Host $host;
    }
    location /api/device-registry/ {
        proxy_pass http://ota-lith:7300/device-registry/api/v1/;
        proxy_set_header x-ats-namespace default;
        proxy_set_header Host $host;
    }
    location /api/reposerver/ {
        proxy_pass http://ota-lith:7100/api/v1/;
        proxy_set_header x-ats-namespace default;
        proxy_set_header Host $host;
        client_max_body_size 1G;
    }

    # Remote access admin API -> ras :9080 /admin/. Lazy-resolved via docker DNS so the console
    # still starts on instances where the optional `ras` service isn't deployed (requests 502 then).
    location ~ ^/api/ras/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ras_host ras;
        proxy_pass http://$ras_host:9080/admin/$1$is_args$args;
        proxy_set_header Host $host;
        # WebSocket upgrade for the web terminal (/api/ras/terminal/<uuid>); harmless for plain JSON.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Observability (optional `ops` sidecar) -> ops :9910 /api/. Lazy-resolved so the console
    # still starts when the overlay isn't deployed. SSE log stream needs buffering off.
    location ~ ^/api/ops/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ops_host ops;
        proxy_pass http://$ops_host:9910/api/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    # Offline updates ("Lockboxes") -> lockbox :9920 /api/. Lazy-resolved like the others, and
    # buffering off so a large bundle streams out instead of being spooled to disk first.
    location ~ ^/api/(lockbox|lockboxes|credentials)(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $lockbox_host lockbox;
        proxy_pass http://$lockbox_host:9920/api/$1$2$is_args$args;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Device provisioning (Torizon-style): serve the scripts and mint credentials.
    location = /provision-device.sh  { proxy_pass http://provisioner:9900/provision-device.sh; }
    location = /install-reporter.sh  { proxy_pass http://provisioner:9900/install-reporter.sh; }
    # Deployed instance version — ota-lith bakes its git commit + build time at build (BuildInfo).
    location = /api/version          { proxy_pass http://ota-lith:7100/health/version; }
    location = /api/provision        { proxy_pass http://provisioner:9900/api/provision; }
    # Operators mint short-lived enrollment tokens here (kept behind the console login at the front).
    location = /api/provision-tokens { proxy_pass http://provisioner:9900/api/provision-tokens; }
}
