# Release compose: pulls prebuilt images instead of building from source (no JDK/sbt needed).
# Set the image namespace + tag, then bring it up:
#
#   export OTA_CE_NS=<your-dockerhub-user>      # e.g. estebansannin
#   export OTA_CE_TAG=latest                    # or a version like 0.1.0
#   ./bootstrap.sh                              # generates certs, then `up -d` with this file
#
# Only ota-lith and provisioner are our images; the rest are stock nginx/mariadb + mounted
# config, so this file still uses the repo's config files and the locally-generated ota-ce-gen/.
services:
  reverse-proxy:
    image: nginx:1.27
    restart: always
    # internal only (reached by the gateway via the docker network); never published to the host,
    # so it can't be hit from the public internet and leaves port 80 free for the Caddy front.
    expose:
      - "80"
    depends_on:
      - ota-lith
    volumes:
      - ./ota-ce/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  gateway:
    image: nginx:1.27
    restart: always
    command: ["nginx-debug", "-g", "daemon off;"]
    expose:
      - '80'
      - '443'
      - '8443'
    ports:
      - '30443:8443'
    depends_on:
      - ota-lith
      - reverse-proxy
    volumes:
      - ./ota-ce/gateway.conf:/etc/nginx/conf.d/gateway.conf:ro
      - ./ota-ce-gen/server.chain.pem:/etc/ssl/gateway/server.chain.pem:ro
      - ./ota-ce-gen/server.key:/etc/ssl/gateway/server.key:ro
      - ./ota-ce-gen/devices/ca.crt:/etc/ssl/gateway/ca.crt:ro

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
    command:
      - --max-connections=10000
      - --character-set-server=utf8
      - --collation-server=utf8_unicode_ci
    # bound to localhost only — the DB must never be reachable from the public internet
    # (containers still reach it as `db` over the docker network).
    ports:
      - '127.0.0.1:3306:3306'
    expose:
      - '3306'
    volumes:
      - ./db-bootstrap:/docker-entrypoint-initdb.d:ro
      - ota-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  ota-lith:
    image: ${OTA_CE_NS:?set OTA_CE_NS to your image namespace}/ota-lith:${OTA_CE_TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command:
      - "-Dconfig.file=/tmp/ota-lith.conf"
    volumes:
      - ./ota-lith-ce.conf:/tmp/ota-lith.conf:ro
      - objects:/var/lib/ota-lith
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7100/health/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  console:
    image: nginx:1.27
    restart: always
    # On a public VPS set CONSOLE_BIND=127.0.0.1 so the console is only reachable via the Caddy
    # TLS+password front (compose.public.yaml); on a LAN it defaults to all interfaces.
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:8080:80"
    depends_on:
      - ota-lith
    volumes:
      - ./console/index.html:/usr/share/nginx/html/index.html:ro
      - ./console/apidocs:/usr/share/nginx/html/apidocs:ro
      - ./console/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  provisioner:
    image: ${OTA_CE_NS:?set OTA_CE_NS to your image namespace}/ota-ce-provisioner:${OTA_CE_TAG:-latest}
    restart: always
    depends_on:
      - ota-lith
    environment:
      - GATEWAY_URL=https://ota.ce:30443
      - DEVICE_REGISTRY_URL=http://ota-lith:7300/device-registry/api/v1/devices
      - NAMESPACE=default
      # Enrollment tokens: leave PROVISION_TOKEN empty and set PROVISION_REQUIRE_TOKEN=1 to require
      # short-lived tokens the operator mints from the console (recommended for a public instance).
      - PROVISION_TOKEN=${PROVISION_TOKEN:-}
      - PROVISION_REQUIRE_TOKEN=${PROVISION_REQUIRE_TOKEN:-}
      - PROVISION_TOKEN_TTL=${PROVISION_TOKEN_TTL:-3600}
    volumes:
      - ./ota-ce-gen:/gen:ro
      - ./scripts/certs:/certs:ro

  # Remote access server (RAC-compatible reverse-SSH). Optional — see remote-access/README.md.
  # Set RAS_PUBLIC_HOST to the public hostname devices + operators reach (your dyndns/VPS name).
  # The HTTP API (9080) stays internal; the gateway (/ras/) and console (/api/ras/) proxy to it.
  # Publish the bastion control port (2222) + the reverse-tunnel range (22000-22003) — on a
  # home server these must be forwarded through your router; on a VPS just open them.
  ras:
    image: ${OTA_CE_NS:?set OTA_CE_NS to your image namespace}/ras:${OTA_CE_TAG:-latest}
    restart: always
    environment:
      - RAS_BASTION_PUBLIC_HOST=${RAS_PUBLIC_HOST:-ota.ce}
      - RAS_SSH_USER=${RAS_SSH_USER:-torizon}
      - RAS_PORT_RANGE_START=22000
      - RAS_PORT_RANGE_COUNT=4
    expose:
      - '9080'
    ports:
      - '2222:2222'
      - '22000-22003:22000-22003'
    volumes:
      - ras-data:/data

volumes:
  ota-db:
  objects:
  ras-data:
