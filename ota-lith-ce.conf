include "application"

ats {
  ota-lith = {
    db.default_host = "db"
    http.default_client_host = "ota-lith"
  }

  database {
    encryption {
      salt = "QyHon03eqkw="
      password = "kxHUuCWMLjUcEvsgaf3EfArToM79psmKsAJRMesApwEK9bdVdFNMpfcL7tKJkups"
    }
  }

  reposerver {
    storage {
      # Local disk by default. compose.s3.yaml sets STORAGE_TYPE=s3 (+ TUF_REPOSERVER_AWS_*) to
      # store targets in the bundled MinIO instead, which is what makes out-of-band uploads
      # (torizoncore-builder's `platform push`) work — local storage refuses them.
      type = "local"
      type = ${?STORAGE_TYPE}
      localStorageRoot = "/var/lib/ota-lith/tuf-objects"
    }
  }

  treehub {
    storage {
      type = "local"
      local {
        path = "/var/lib/ota-lith/treehub-objects"
      }
    }
  }

  messaging {
    mode = "test"
  }
}
