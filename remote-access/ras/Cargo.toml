[package]
name = "ras"
version = "0.1.0"
edition = "2021"
description = "Minimal open remote-access server (RAC-compatible): HTTP API + TUF remote-sessions + SSH bastion"
license = "Apache-2.0"

[[bin]]
name = "ras"
path = "src/main.rs"

# Versions mirror torizon/rac (proven to compile together with the toradex/tough fork).
[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = { version = "0.6.7", features = ["ws"] }
tower = "0.4"
russh = "0.46.0"
russh-keys = "0.46.0"
ssh-key = { version = "0.5.1", features = ["serde", "ed25519"] }
tough = { git = "https://github.com/toradex/tough", branch = "rac", features = ["http", "reqwest"] }
ring = "0.17"
olpc-cjson = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["serde", "v4"] }
url = { version = "2.3", features = ["serde"] }
async-trait = "0.1"
eyre = "0.6"
color-eyre = { version = "0.6", default-features = false }
futures = "0.3"
log = "0.4"
env_logger = "0.10"
