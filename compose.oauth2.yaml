# Optional: per-user console login via GitHub instead of one shared password.
# Layer it on top of the release + public compose:
#
#   docker compose -f compose.release.yaml -f compose.public.yaml -f compose.oauth2.yaml \
#     --env-file .env up -d
#
# Requires in .env (see docs/console-auth.md for how to create the GitHub OAuth app):
#   GITHUB_CLIENT_ID=...          # from the OAuth app
#   GITHUB_CLIENT_SECRET=...      # from the OAuth app — keep this secret
#   OAUTH_COOKIE_SECRET=...       # 32 random bytes, base64 (the deploy script generates one)
#   OAUTH_ALLOWED_USERS=me,friend # GitHub logins allowed in — NEVER leave this empty, or any
#                                 # GitHub account on the internet could sign in
#
# oauth2-proxy supports ONE provider per instance (multi-provider is an incomplete upstream
# feature), so this is GitHub only. For GitHub + Google, put an identity broker (e.g. Dex) here.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: always
    logging: *default-logging
    depends_on:
      - console
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}
      # GitHub identities are logins, not email domains — accept any email, then restrict to the
      # explicit allowlist below.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_GITHUB_USERS: ${OAUTH_ALLOWED_USERS}
      OAUTH2_PROXY_REDIRECT_URL: https://${RAS_PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://console:80
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Behind Caddy: trust X-Forwarded-* so redirects and cookies use the public https URL.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # One provider, so skip the "choose a provider" interstitial.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # The web terminal and the live-log stream are long-lived connections through here.
      OAUTH2_PROXY_PROXY_WEBSOCKETS: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
    expose:
      - "4180"       # internal only — Caddy is the public entry point
