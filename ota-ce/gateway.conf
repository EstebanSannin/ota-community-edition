server {
    error_log  /var/log/nginx/error.log info;
    listen       8443 ssl;
    server_name ota.ce;
    # Never emit absolute redirects — nginx would build them from the internal :8443 port,
    # which isn't reachable from devices (they connect on the published :30443).
    absolute_redirect off;
    ssl_certificate     /etc/ssl/gateway/server.chain.pem;
    ssl_certificate_key /etc/ssl/gateway/server.key;
    ssl_verify_client on;
    ssl_verify_depth 10;
    ssl_client_certificate /etc/ssl/gateway/ca.crt;

    if ($ssl_client_s_dn ~ "CN=(.*)$") {
        set $deviceUuid $1;
    }
    if ($ssl_client_s_dn !~ "CN=(.*)$") {
        set $deviceUuid $ssl_client_s_dn;
    }
    set $deviceNamespace "default";

    # NEVER compress anything on this vhost. TUF integrity is over the exact bytes of each
    # metadata file: snapshot.json pins the sha256 and length of targets.json, so a gzipped
    # response can never verify. aktualizr advertises `Accept-Encoding: gzip`, and with
    # compression enabled it received 2184 gzipped bytes where the snapshot pinned 3829 —
    # every app update then failed with "Snapshot hash mismatch for targets metadata".
    # `gzip off` stops us compressing; clearing the header upstream stops ota-lith doing it.
    gzip off;
    proxy_set_header Accept-Encoding "";

    # TODO: use proxying through traefik/nginx instea of port numbers

    location /treehub/ {
        rewrite ^/treehub/(.*)$ /api/v2/$1 break;
        proxy_set_header x-ats-device-uuid $deviceUuid;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7400;
    }

    location /director/ {
        rewrite ^/director/(.*)$ /api/v1/device/${deviceUuid}/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Host director.ota.ce;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://reverse-proxy;
    }

    location /repo/ {
        rewrite ^/repo/(.*)$ /api/v1/user_repo/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7100;
    }

    # device-registry endpoints are now served by the director (merged in) on :7300
    # under the /device-registry/api/v1 prefix (was the standalone service on :7500).
    # aktualizr PUTs the lshw hardware inventory to exactly /system_info (no trailing slash).
    # Without this exact-match block nginx 301-redirects it to /system_info/ and the report is
    # dropped — which is why hardware info stayed empty while /system_info/network worked.
    location = /system_info {
        rewrite ^ /device-registry/api/v1/devices/$deviceUuid/system_info break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7300;
    }

    location /system_info/ {
        rewrite ^/system_info/(.*)$ /device-registry/api/v1/devices/$deviceUuid/system_info/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7300;
    }

    location /core/ {
        rewrite ^/core/(.*)$ /device-registry/api/v1/mydevice/$deviceUuid/$1 break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7300;
    }

    location /core/installed {
        rewrite ^/core/(.*)$ /device-registry/api/v1/mydevice/$deviceUuid/packages break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7300;
    }

    # aktualizr posts the event batch to exactly /events (no trailing slash). Match both
    # /events and /events/ so nginx never issues a trailing-slash redirect (which would
    # otherwise 301 to the internal :8443 port and break event reporting).
    location /events {
        rewrite ^/events/?$ /device-registry/api/v1/devices/$deviceUuid/events break;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://ota-lith:7300;
    }

    # Remote access (RAC): the device (rac) reaches ras through this mTLS gateway; the verified
    # cert CN (device UUID) is passed to ras as x-device-uuid. Lazily DNS-resolved via docker's
    # embedded resolver so the gateway still starts when the OPTIONAL ras service isn't deployed
    # (requests 502 then). The regex capture rebuilds the path: /ras/sessions -> ras:/sessions,
    # /ras/director/root.json -> ras:/director/root.json.
    #
    # SECURITY: allowlist ONLY the device-facing endpoints. ras also serves an /admin/ API
    # (arm/kill sessions, open web terminals) whose only intended caller is the operator console
    # behind the login. A device certificate must never reach it — otherwise any device (or anyone
    # who extracts a device's client cert) could arm sessions with its own SSH keys and open a
    # terminal on every other device in the fleet. Deny-by-default: the catch-all below refuses
    # anything under /ras/ that isn't listed here.
    location ~ ^/ras/(public-keys|sessions|commands|ok|director/[A-Za-z0-9._-]+)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ras_upstream ras;
        proxy_set_header Accept-Encoding "";   # never let ota-lith gzip: TUF hashes exact bytes
        proxy_pass http://$ras_upstream:9080/$1$is_args$args;
        proxy_set_header x-device-uuid $deviceUuid;
        proxy_set_header x-ats-namespace $deviceNamespace;
        proxy_set_header Host $host;
    }
    location ~ ^/ras/ { return 403; }
}
