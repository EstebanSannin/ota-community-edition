# Host-based reverse proxy for the ota-lith monolith's four HTTP services.
# Replaces Traefik (which required the Docker socket / a compatible Docker API).
# Plain nginx: no Docker dependency, routes *.ota.ce by Host header to the in-container ports.

server {
    listen 80;
    server_name reposerver.ota.ce;
    location / {
        proxy_pass http://ota-lith:7100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1G;
    }
}

server {
    listen 80;
    server_name keyserver.ota.ce;
    location / {
        proxy_pass http://ota-lith:7200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name director.ota.ce;
    location / {
        proxy_pass http://ota-lith:7300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1G;
    }
}

server {
    listen 80;
    server_name treehub.ota.ce;
    location / {
        proxy_pass http://ota-lith:7400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1G;
    }
}

# default: return 404 for unknown hosts
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
