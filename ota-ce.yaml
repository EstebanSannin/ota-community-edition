# version: '3.8'

# TODO: Some proxy for reposerver.ota.ce and such so don't have to use proxies

# TODO: Kafka

services:
  reverse-proxy:
    # Plain nginx Host-based router for *.ota.ce (replaced Traefik, which depended on the
    # Docker socket and an API version too new for its client on Docker 29).
    image: nginx:1.27
    restart: always
    ports:
      - "80:80"
    depends_on:
      - ota-lith
    volumes:
      - ./ota-ce/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  gateway:
    image: nginx:1.27
    restart: always
    command: ["nginx-debug", "-g", "daemon off;"]      
    expose:
      - '80'
      - '443'
      - '8443'
    ports:
#      - '80'
      - '8443'
      - '30443:8443'
    depends_on:
      - ota-lith
      - reverse-proxy
    volumes:
      - ./ota-ce/gateway.conf:/etc/nginx/conf.d/gateway.conf:ro
      - ./ota-ce-gen/server.chain.pem:/etc/ssl/gateway/server.chain.pem:ro
      - ./ota-ce-gen/server.key:/etc/ssl/gateway/server.key:ro
      - ./ota-ce-gen/devices/ca.crt:/etc/ssl/gateway/ca.crt:ro

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
    command:
      - --max-connections=10000
      - --character-set-server=utf8
      - --collation-server=utf8_unicode_ci
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - ./db-bootstrap:/docker-entrypoint-initdb.d:ro
      - ota-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  ota-lith:
    image: uptane/ota-lith:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command:
       - "-Dconfig.file=/tmp/ota-lith.conf"
    volumes:
      - ./ota-lith-ce.conf:/tmp/ota-lith.conf:ro
      - objects:/var/lib/ota-lith
    healthcheck:
      # exec form can't parse the shell '|| exit 1'; use CMD-SHELL. curl is present in the image.
      test: ["CMD-SHELL", "curl -fsS http://localhost:7100/health/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Minimal OTA console — a small static SPA (served by nginx) that proxies the backend
  # JSON APIs same-origin. Replaces the legacy Quasar web-ui. Open at http://<host>:8080
  console:
    image: nginx:1.27
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - ota-lith
    volumes:
      - ./console/index.html:/usr/share/nginx/html/index.html:ro
      - ./console/apidocs:/usr/share/nginx/html/apidocs:ro
      - ./console/vendor:/usr/share/nginx/html/vendor:ro
      - ./console/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Device provisioning service — serves provision-device.sh and mints+registers device
  # credentials on demand (the self-hosted equivalent of Torizon Cloud's accounts API).
  provisioner:
    build: ./provisioner
    restart: always
    depends_on:
      - ota-lith
    environment:
      - GATEWAY_URL=${GATEWAY_URL:-https://ota.ce:30443}
      - DEVICE_REGISTRY_URL=http://ota-lith:7300/device-registry/api/v1/devices
      - NAMESPACE=default
      # Enrollment tokens. Set PROVISION_REQUIRE_TOKEN=1 to require short-lived tokens the operator
      # mints from the console; PROVISION_TOKEN is an optional static fallback. Unset both = open (LAN).
      - PROVISION_TOKEN=${PROVISION_TOKEN:-}
      - PROVISION_REQUIRE_TOKEN=${PROVISION_REQUIRE_TOKEN:-}
      - PROVISION_TOKEN_TTL=${PROVISION_TOKEN_TTL:-3600}
    volumes:
      - ./ota-ce-gen:/gen:ro
      - ./scripts/certs:/certs:ro

  # Remote access server (RAC-compatible reverse-SSH). Optional — see remote-access/README.md.
  # Built from source here; set RAS_PUBLIC_HOST to the hostname devices+operators reach.
  ras:
    build: ./remote-access/ras
    restart: always
    environment:
      - RAS_BASTION_PUBLIC_HOST=${RAS_PUBLIC_HOST:-ota.ce}
      - RAS_SSH_USER=${RAS_SSH_USER:-torizon}
      - RAS_PORT_RANGE_START=22000
      - RAS_PORT_RANGE_COUNT=4
    expose:
      - '9080'
    ports:
      - '2222:2222'
      - '22000-22003:22000-22003'
    volumes:
      - ras-data:/data

  # Kafka and Zookeeper are optional when using test message bus mode
  # Uncomment these if you need Kafka for production message bus
  # zookeeper:
  #   image: wurstmeister/zookeeper
  #   ports:
  #     - "2181:2181"
  # kafka:
  #   image: wurstmeister/kafka:2.13-2.7.1
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_ADVERTISED_HOST_NAME: kafka
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ota-db:
  objects:
  ras-data:
